syntax = "proto3";

package auth.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "ehedges.net/ccgui/backend/gen/auth/v1;authv1";

// AuthService manages API keys used to authenticate websocket clients.
service AuthService {
  // Login to a user account
  rpc Login(LoginRequest) returns (IssuedTokensResponse) {}
  // Logout of a session
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {}
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message IssuedTokensResponse {
  string refresh_token = 1;
  string access_token = 2;
  google.protobuf.Timestamp access_token_expiry = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}